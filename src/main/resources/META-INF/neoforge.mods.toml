modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# libworks-runtime, nested by jar-in-jar: a Displacer in Jade is its MachineReport. The
# range is the one libworks { runtime } in build.gradle nests, to the next minor.
[[dependencies.${mod_id}]]
modId = "libworks"
type = "required"
versionRange = "${libworks_runtime_range}"
ordering = "NONE"
side = "BOTH"

# Shows what a void block holds in Jade's tooltip (#37). Not required: its plugin is only loaded by
# Jade. The range is the Jade the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"
