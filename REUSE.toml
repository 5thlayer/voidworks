version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitmodules",
    "**/*.mods.toml",
    "**/*.md",
    "src/main/resources/**/*.json",
    "src/gametest/resources/**/*.json",
    "src/gametest/resources/**/*.mcmeta",
    "src/main/resources/**/*.mcmeta",
    "src/main/resources/**/*.nbt",
    "src/main/resources/**/*.png",
    "LICENSE",
    "NOTICE",
    "publish/summary.txt",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# Malcolm Riley's unused textures: the Void Siphon's, the Void Displacers', Voidstone's, the
# Mutation and Unmaking Chambers', the Void Crucible's, the Void Well's and the Drained Dragon Egg's sprites, with the unmodified copies they are built from (NOTICE).
[[annotations]]
path = [
    "data/art/*.png",
    "data/art/*.png.mcmeta",
    "src/main/resources/assets/voidworks/textures/item/void_siphon.png",
    "src/main/resources/assets/voidworks/textures/item/resonant_void_siphon.png",
    "src/main/resources/assets/voidworks/textures/item/draconic_void_siphon.png",
    "src/main/resources/assets/voidworks/textures/block/void_well_*.png",
    "src/main/resources/assets/voidworks/textures/block/void_well_*.png.mcmeta",
    "src/main/resources/assets/voidworks/textures/block/overworld_void_displacer_*.png",
    "src/main/resources/assets/voidworks/textures/block/overworld_void_displacer_*.png.mcmeta",
    "src/main/resources/assets/voidworks/textures/block/end_void_displacer_*.png",
    "src/main/resources/assets/voidworks/textures/block/end_void_displacer_*.png.mcmeta",
    "src/main/resources/assets/voidworks/textures/block/nether_void_displacer_*.png",
    "src/main/resources/assets/voidworks/textures/block/nether_void_displacer_*.png.mcmeta",
    "src/main/resources/assets/voidworks/textures/block/voidstone.png",
    "src/main/resources/assets/voidworks/textures/block/end_voidstone.png",
    "src/main/resources/assets/voidworks/textures/block/nether_voidstone.png",
    "src/main/resources/assets/voidworks/textures/block/mutation_chamber_side*.png",
    "src/main/resources/assets/voidworks/textures/block/unmaking_chamber_side*.png",
    "src/main/resources/assets/voidworks/textures/block/void_crucible_*.png",
    "src/main/resources/assets/voidworks/textures/block/drained_dragon_egg*.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

# The engineering skills are copied from mattpocock/skills v1.3.1.
[[annotations]]
path = [".claude/skills/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Matt Pocock"
SPDX-License-Identifier = "MIT"

# Temporary cover and icon for mod pages, drawn from the Voidstone and Displacer sprites.
[[annotations]]
path = ["publish/*.png"]
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"
